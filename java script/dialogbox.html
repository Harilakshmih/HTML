<!DOCTYPE html>
<html>
<head>
<title>Student Form</title>

<script>
function showMessage()
{

    var name = prompt("Enter your name:");

    alert("Thank You " + name);
}
</script>

</head>

<body bgcolor="pink">

<center><h2>Student Details Form</center></h2>

Gender:

<input type="radio" name="gender"> Female
<br><br>

Address:<br>

</form>

</html>
